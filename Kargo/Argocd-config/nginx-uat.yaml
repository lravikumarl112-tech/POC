apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-uat
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/lravikumarl112-tech/POC.git
    targetRevision: main
    path: Kargo/overlays/uat

  destination:
    server: https://kubernetes.default.svc
    namespace: uat-ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
