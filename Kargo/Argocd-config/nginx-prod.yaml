apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/lravikumarl112-tech/POC.git
    targetRevision: main
    path: Kargo/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod-ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
